<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Rakib Gallery</title>
<link rel="stylesheet" href="/style.css?v=3">
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-icon">📂</div>
    <div>
      <div class="brand-title">Rakib Gallery</div>
      <div class="brand-sub">File Manager</div>
    </div>
  </div>

  <button id="historyBtn" class="top-btn">🔐 History</button>
</header>

<section class="toolbar">
  <button id="backBtn" class="tool-btn">←</button>

  <div id="breadcrumb" class="breadcrumb">
    <span>📂 Home</span>
  </div>

  <button id="refreshBtn" class="tool-btn">↻</button>
</section>

<div class="search-wrap">
  <input
    id="search"
    type="search"
    placeholder="Search files and folders..."
    autocomplete="off"
  >
</div>

<main id="content">
  <div class="loading">Loading gallery...</div>
</main>

<div id="viewer" class="viewer hidden">
  <div class="viewer-head">
    <div id="viewerName">Preview</div>

    <div class="viewer-actions">
      <a id="downloadBtn" class="viewer-btn" download>⬇</a>
      <button id="closeViewer" class="viewer-btn">×</button>
    </div>
  </div>

  <div id="viewerBody" class="viewer-body"></div>
</div>

<div id="historyModal" class="modal hidden">
  <div class="vault">

    <div class="vault-head">
      <div>
        <div class="vault-title">🔐 Private History</div>
        <div class="vault-sub">This device's activity</div>
      </div>

      <button id="closeHistory" class="close-btn">×</button>
    </div>

    <div id="historyLogin">
      <input
        id="historyPassword"
        type="password"
        placeholder="History password"
      >
      <button id="historyLoginBtn">Unlock History</button>
      <div id="historyError"></div>
    </div>

    <div id="historyContent" class="hidden">
      <div class="history-toolbar">
        <button id="clearHistory">Clear History</button>
      </div>

      <div id="historyList"></div>
    </div>

  </div>
</div>

<script src="/app.js?v=3"></script>
</body>
</html>
